server:
  port: 8082

spring:
  application:
    name: despacho-service

  datasource:
    url: jdbc:postgresql://${DESPACHO_DB_HOST:localhost}:${DESPACHO_DB_PORT:5432}/${DESPACHO_DB_NAME:despacho_db}
    username: ${DESPACHO_DB_USER:despacho_user}
    password: ${DESPACHO_DB_PASSWORD:despacho_pass}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        order_updates: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}
      client:
        registration:
          logistica-service:
            provider: keycloak
            client-id: ${SERVICE_CLIENT_ID:logistica-service}
            client-secret: ${SERVICE_CLIENT_SECRET:dev-service-secret-cambiar}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/token}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    utnfc.isi.back.logistica: ${LOG_LEVEL:INFO}

despacho:
  zona-horaria: ${TZ_OPERACION:America/Argentina/Cordoba}

  planificacion:
    tiempo-servicio-min: ${TIEMPO_SERVICIO_MIN:5}

  pedidos:
    base-url: ${PEDIDOS_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s

  notificaciones:
    intervalo-ms: ${NOTIF_INTERVALO_MS:15000}
    max-intentos: 50

  distancias:
    osrm:
      base-url: ${OSRM_URL:https://router.project-osrm.org}
      connect-timeout: 2s
      read-timeout: 5s
    cache-ttl-dias: 30
    factor-rodeo: 1.3
    velocidad-promedio-kmh: 30
