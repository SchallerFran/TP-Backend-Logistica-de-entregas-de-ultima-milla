
services:

  postgres:
    image: postgres:17-alpine
    container_name: logistica-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - logistica-postgres-data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./infra/reset-datos.sql:/infra/reset-datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - logistica-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: logistica-keycloak
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/realm-logistica.json:/opt/keycloak/data/import/realm-logistica.json:ro
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logistica-net

  pedidos-service:
    build:
      context: .
      dockerfile: pedidos-service/Dockerfile
    container_name: pedidos-service
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/Argentina/Cordoba
      PEDIDOS_DB_HOST: postgres
      DESPACHO_SERVICE_URL: http://despacho-service:8082
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/logistica/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/logistica/protocol/openid-connect/token
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - logistica-net

  despacho-service:
    build:
      context: .
      dockerfile: despacho-service/Dockerfile
    container_name: despacho-service
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/Argentina/Cordoba
      DESPACHO_DB_HOST: postgres
      PEDIDOS_SERVICE_URL: http://pedidos-service:8081
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/logistica/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/logistica/protocol/openid-connect/token
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - logistica-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      TZ: America/Argentina/Cordoba
      PEDIDOS_SERVICE_URL: http://pedidos-service:8081
      DESPACHO_SERVICE_URL: http://despacho-service:8082
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/logistica/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      pedidos-service:
        condition: service_healthy
      despacho-service:
        condition: service_healthy
    networks:
      - logistica-net

networks:
  logistica-net:
    driver: bridge

volumes:
  logistica-postgres-data:
