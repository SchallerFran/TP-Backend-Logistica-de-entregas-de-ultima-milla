server:
  port: 8081

spring:
  application:
    name: pedidos-service

  datasource:
    url: jdbc:postgresql://${PEDIDOS_DB_HOST:localhost}:${PEDIDOS_DB_PORT:5432}/${PEDIDOS_DB_NAME:pedidos_db}
    username: ${PEDIDOS_DB_USER:pedidos_user}
    password: ${PEDIDOS_DB_PASSWORD:pedidos_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:ultimamilla.tpbackend@gmail.com}
    password: ${GMAIL_APP_PASSWORD:jhvgvdzyqyjydbqp}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}

notificaciones:
  mail:
    copia: ${MAIL_COPIA:iig2012n@gmail.com,tobyy688@gmail.com,franschaller91@gmail.com}

servicios:
  despacho:
    url: ${DESPACHO_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

keycloak:
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/token}
  service-client-id: ${SERVICE_CLIENT_ID:logistica-service}
  service-client-secret: ${SERVICE_CLIENT_SECRET:dev-service-secret-cambiar}
