server:
  port: 8081

spring:
  application:
    name: pedidos-service

  datasource:
    url: jdbc:postgresql://${PEDIDOS_DB_HOST:localhost}:${PEDIDOS_DB_PORT:5432}/${PEDIDOS_DB_NAME:pedidos_db}
    username: ${PEDIDOS_DB_USER:pedidos_user}
    password: ${PEDIDOS_DB_PASSWORD:pedidos_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Mails de cambio de estado al cliente (Gmail SMTP). Sin GMAIL_APP_PASSWORD no se envían.
  # La contraseña es una "contraseña de aplicación" de Google (16 caracteres): nunca va en el repo.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:ultimamilla.tpbackend@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri = valor esperado del claim "iss" (host publico de Keycloak).
          # jwk-set-uri = de donde se bajan las claves publicas.
          # Al definir jwk-set-uri, Spring NO hace el discovery contra el issuer,
          # asi que la validacion funciona aunque el host publico no sea alcanzable.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}

servicios:
  despacho:
    url: ${DESPACHO_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Gmail no es parte de la salud del servicio: sin mail, los pedidos funcionan igual
    mail:
      enabled: false

keycloak:
  # client_credentials para llamar a /internal de despacho-service (rol SERVICE).
  # El secret por defecto es el de desarrollo de infra/realm-logistica.json.
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/token}
  service-client-id: ${SERVICE_CLIENT_ID:logistica-service}
  service-client-secret: ${SERVICE_CLIENT_SECRET:dev-service-secret-cambiar}
